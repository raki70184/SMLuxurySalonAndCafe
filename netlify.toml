[build]
  command = "npm run build && npm run prerender"
  publish = "dist"

# Bump default Netlify node version to match local dev (16.x is EOL).
[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# ── OneKlick live-chat widget (vite.config.ts injects it when both are set) ──
# Replaces Tawk.to: visitors' messages land in ChatPortal → Inbox → Website
# chat and FAQs auto-reply. Production = prod API + the store-1 token minted in
# ChatPortal (Website Widget → Generate embed code). Until that token is pasted
# below, production builds keep Tawk.to (App.tsx fallback) — no chat gap.
# Deploy previews use the dev API + dev store 13 (SM Luxury dev mirror).
[context.production.environment]
  VITE_ONEKLICK_WIDGET_SRC = "https://api.oneklickai.net/widget.js"
  VITE_ONEKLICK_WIDGET_TOKEN = ""   # ← paste prod store 1 widget token

[context.deploy-preview.environment]
  VITE_ONEKLICK_WIDGET_SRC = "https://dev-api.oneklickai.net/widget.js"
  VITE_ONEKLICK_WIDGET_TOKEN = "FvW4dG6R8_CcsQnJd5jBTFtfOIPcGGu8"   # dev store 13 (SM Luxury dev mirror)

[context.branch-deploy.environment]
  VITE_ONEKLICK_WIDGET_SRC = "https://dev-api.oneklickai.net/widget.js"
  VITE_ONEKLICK_WIDGET_TOKEN = "FvW4dG6R8_CcsQnJd5jBTFtfOIPcGGu8"

# SPA fallback: serve index.html for any unknown path. Prerender writes
# per-route index.html files so direct hits to /about, /services, etc.
# get the static HTML; anything else falls back here.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security headers (apply to all responses) ─────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://api.oneklickai.net https://dev-api.oneklickai.net https://embed.tawk.to https://*.tawk.to https://www.google.com https://www.gstatic.com https://www.googletagmanager.com https://static.cloudflareinsights.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://embed.tawk.to;
      font-src 'self' data: https://fonts.gstatic.com https://embed.tawk.to;
      img-src 'self' data: blob: https://res.cloudinary.com https://*.tawk.to https://www.google.com https://maps.gstatic.com https://maps.googleapis.com https://www.gstatic.com https://www.google-analytics.com https://*.google-analytics.com;
      media-src 'self' https://res.cloudinary.com;
      connect-src 'self' https://api.oneklickai.net https://dev-api.oneklickai.net https://res.cloudinary.com https://script.google.com https://*.googleusercontent.com https://api.emailjs.com https://*.tawk.to wss://*.tawk.to https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://cloudflareinsights.com https://static.cloudflareinsights.com;
      frame-src 'self' https://www.google.com https://embed.tawk.to;
      worker-src 'self' blob:;
      manifest-src 'self';
      base-uri 'self';
      form-action 'self' https://script.google.com;
      frame-ancestors 'self';
      object-src 'none';
      upgrade-insecure-requests
    """
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    # NOTE: Cross-Origin-Embedder-Policy is intentionally NOT set. COEP
    # (require-corp / credentialless) forces every cross-origin embed to send a
    # CORP header — the Google Maps embed iframe does not, so COEP blocks the
    # map. This site uses no SharedArrayBuffer / cross-origin-isolated feature,
    # so COEP buys nothing here. COOP below is safe (it does not affect iframes).
    Cross-Origin-Opener-Policy = "same-origin"
    X-DNS-Prefetch-Control = "on"

# ── Cache policies ────────────────────────────────────────────────────────
# Hashed assets are immutable — cache aggressively.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pre-rendered HTML should always be revalidated to pick up new deploys.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Static config files served from /public/.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"
